name: Build SULISTIA STOK from ZIP

on:
  push:
    paths:
      - 'SULISTIA-STOK-SOURCE.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.1-bin.zip
          unzip -q gradle-9.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-9.1/bin" >> "$GITHUB_PATH"

      - name: Extract source ZIP
        run: |
          mkdir build-src
          unzip -q SULISTIA-STOK-SOURCE.zip -d build-src

      - name: Build APK
        working-directory: build-src
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SULISTIA-STOK-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
